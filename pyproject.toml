[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ease-bot"
version = "0.1.1"
description = "Verified LLM repair of Terraform and Kubernetes misconfigurations on pull requests"
readme = "README.md"
license = {text = "MIT"}
authors = [{name = "Shohrab Hossen Niaz"}]
requires-python = ">=3.10"
dependencies = ["requests>=2.31", "pyyaml>=6"]

[project.optional-dependencies]
scan = ["checkov>=3.2"]
test = ["pytest>=8"]

[project.scripts]
easebot = "easebot.cli:main"

[tool.setuptools]
packages = ["easebot"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: needs checkov installed"]
